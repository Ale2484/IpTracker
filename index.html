<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/app.js"></script>
    <title>IP Tracker</title>
</head>
<body class="flex flex-col bg-[#0C131C] min-h-screen">
    <nav class="py-5 px-6 flex items-center text-xl bg-[#111723]">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-7 md:size-10 text-[#3077FD]">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
        </svg>
        <h1 class="text-[#3077FD] font-bold text-lg md:text-2xl">IP <span class="text-white">Tracker</span></h1>
    </nav>

    <!-- Contenedor principal -->
    <div class="w-full mt-10 md:mt-0 md:flex-1 flex flex-col items-center justify-center px-5 mb-10">
        <h2 class="text-3xl md:text-4xl text-white font-bold text-center mt-5">Rastrear una dirección <span class="text-[#3077FD]">IP</span></h2>
        <p class="text-[#8C96A5] mb-10 text-center text-base md:text-lg py-2">Obtén informacion detallada sobre cualquier dirección IP de forma rapida y sencilla</p>
        <!-- Buscador -->
         <form action="#test" method="post" id="searchIpForm" class="w-full md:w-[65%] flex relative mb-10">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-[#8C96A5] absolute left-4 top-1/2 -translate-y-1/2">
                <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>
            <input type="search" name="ip" id="ip" placeholder="Ingresa una dirección IP (ej: 8.8.8.8)" class="bg-[#18202C] py-2 md:py-3 px-3 text-white rounded-lg rounded-tr-none rounded-br-none border border-[#232B37] text-lg md:text-xl w-[80%] pl-12 focus:outline-none">
            <button type="submit" class="w-[20%] bg-[#3077FD] text-white rounded-lg rounded-tl-none rounded-bl-none hover:bg-[#0059ff] transition-all">Buscar</button>
         </form>

         <!-- Contenedor de resultados de la busqueda -->
         <div id="resultContainer" class="bg-[#18202C] border border-[#232B37] rounded-lg w-full md:w-[70%] grid grid-cols-3 grid-rows-[3rem_repeat(6,1fr)] gap-2 min-h-72">
            <!-- Informacion del resultado -->
             <div id="resultInfo" class="col-span-full w-full h-12 flex items-center justify-between bg-[#18202C] rounded-t-lg border-b border-[#232B37] px-3 hidden">
                <div class="flex items-center gap-2 h-full">
                    <div class="bg-green-600 rounded-full p-1"></div>
                    <p id="resultText" class="text-[#8C96A5]"></p>
                </div>
                <p id="resultDate" class="text-[#8C96A5]"></p>
             </div>
             <!-- Info basica -->
            <div id="basicInfo" class="col-span-full row-span-6 flex flex-col items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-20 text-[#8C96A5] mb-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 0 1 3 12c0-1.605.42-3.113 1.157-4.418" />
                </svg>
                <p class="text-lg md:text-2xl text-[#BDC4D0] text-center font-semibold col-span-full row-span-">Aquí se mostrará la información de la IP</p>
                <p class="text-base md:text-lg text-[#8C96A5] text-center col-span-full">Ingresa una dirección IP y presiona en buscar</p>
            </div>
         </div>
    </div>
</body>
</html>
